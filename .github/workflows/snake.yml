# Generates the snake that eats the contribution graph and publishes the SVGs to the "output" branch.
name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allows manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0f766e&color_dots=#ebedf0,#99f6e4,#2dd4bf,#0d9488,#115e59
            dist/snake-dark.svg?palette=github-dark&color_snake=#5eead4&color_dots=#161b22,#0e4d48,#0f766e,#14b8a6,#5eead4

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
